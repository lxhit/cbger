[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbger"
version = "1.0.0"
description = "CBGER-10K benchmark and CBGER model for personalized video evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vision = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.49",
  "accelerate>=1.2",
  "sentence-transformers>=3.3",
  "av>=12.0",
  "opencv-python>=4.10",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

